<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liha WebMCP Adapter — Make any website agent-ready</title>
    <meta
      name="description"
      content="Add auditable WebMCP tools to websites that never implemented WebMCP. Declarative, origin-scoped, open source."
    />
    <link rel="canonical" href="https://webmcp-adopter.liha.dev/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Liha WebMCP Adapter" />
    <meta property="og:title" content="Liha WebMCP Adapter — Make any website agent-ready" />
    <meta
      property="og:description"
      content="Add auditable WebMCP tools to websites that never implemented WebMCP. Declarative, origin-scoped, open source."
    />
    <meta property="og:url" content="https://webmcp-adopter.liha.dev/" />
    <meta property="og:image" content="https://webmcp-adopter.liha.dev/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Liha WebMCP Adapter — Make any website agent-ready" />
    <meta
      name="twitter:description"
      content="WebMCP adoption no longer has to wait for every website owner."
    />
    <meta name="twitter:image" content="https://webmcp-adopter.liha.dev/og.svg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <script>
      // Applied before first paint so an explicit appearance choice does not
      // flash the system one first. The app re-applies it on mount anyway.
      try {
        var t = localStorage.getItem('liha.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('liha.locale');
        document.documentElement.lang =
          l === 'ja' || l === 'en' ? l : (navigator.language || 'en').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
      } catch (error) {
        // Storage blocked: fall through to the system appearance and English.
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
