<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Liha WebMCP Adapter — Make any website agent-ready">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="8" fill="#101317"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="26" letter-spacing="3" fill="#5c6672">LIHA WEBMCP ADAPTER</text>
    <text x="80" y="268" font-size="76" font-weight="700" fill="#101317">Make any website</text>
    <text x="80" y="352" font-size="76" font-weight="700" fill="#101317">agent-ready.</text>
    <text x="80" y="430" font-size="30" fill="#5c6672">Add auditable WebMCP tools to websites that never</text>
    <text x="80" y="472" font-size="30" fill="#5c6672">implemented WebMCP.</text>
    <g font-size="22" fill="#5c6672">
      <rect x="80" y="518" width="196" height="52" fill="none" stroke="#e3e6ea" stroke-width="2"/>
      <text x="104" y="551">Declarative JSON</text>
      <rect x="296" y="518" width="186" height="52" fill="none" stroke="#e3e6ea" stroke-width="2"/>
      <text x="320" y="551">Origin-scoped</text>
      <rect x="502" y="518" width="150" height="52" fill="none" stroke="#e3e6ea" stroke-width="2"/>
      <text x="526" y="551">MIT licensed</text>
    </g>
  </g>
</svg>
