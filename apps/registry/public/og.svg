<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Liha WebMCP Adapter — Make any website agent-ready">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#3d3d40"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif"
